<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Nemesis">
  <defs>
    <radialGradient id="orb" cx="50%" cy="42%" r="62%">
      <stop offset="0%" stop-color="#8affc1"/>
      <stop offset="42%" stop-color="#25d366"/>
      <stop offset="100%" stop-color="#0b7a3b"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#25d366" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#25d366" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- app-icon rounded-square field -->
  <rect x="0" y="0" width="512" height="512" rx="112" fill="#0f1115"/>
  <!-- ambient glow -->
  <circle cx="256" cy="248" r="190" fill="url(#glow)"/>
  <!-- the orb -->
  <circle cx="256" cy="248" r="132" fill="url(#orb)"/>
  <!-- specular highlight -->
  <ellipse cx="212" cy="196" rx="46" ry="30" fill="#ffffff" opacity="0.28"/>
  <!-- orbit ring (the "watchful" nemesis motif) -->
  <ellipse cx="256" cy="248" rx="196" ry="82" fill="none" stroke="#25d366" stroke-width="7" opacity="0.5" transform="rotate(-24 256 248)"/>
  <circle cx="94" cy="300" r="13" fill="#8affc1"/>
</svg>

# Guardrail suite — manual-only since 2026-08-05 (owner decision).
#
# Runs scripts/guardrail-suite.ts against the DEPLOYED /ask function as a real
# authenticated user: every doc-20 "must NEVER produce" row + the Phase-7 high-risk
# families must hold (no forbidden pattern; safe routing present).
#
# This no longer runs on pull requests. Nemesis is a field-agnostic academic OS;
# the medication-safety suite tests one legacy data source (/ask) that PR code
# cannot affect — it probes the LIVE deployment, so a red here never reflected
# the PR under review, and its phrasing matchers false-fail often enough that it
# cost real merge latency. Trigger it manually (Actions → guardrail → Run
# workflow) when the /ask service itself changes.
#
# Cost note: each run makes real (DeepSeek-backed) /ask calls. SB_URL is the
# public project URL; SERVICE_KEY + ANON_KEY come from repo secrets (never committed).

name: guardrail

on:
  workflow_dispatch: {}

# One run per ref; a newer push cancels an in-flight run (saves LLM calls).
concurrency:
  group: guardrail-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guardrail:
    runs-on: ubuntu-latest
    # 🔴 25, NOT 15. At 15 this gate had not finished a single run in its last
    # fifteen attempts — every one showed up as "cancelled" or "failure", and it
    # read like a broken safety check when the suite was in fact passing.
    #
    # MEASURED, not guessed. The 2026-08-02 run on PR #381 was killed at 15m16s
    # having completed 48 of 51 cases (17 CASES x 3 registers), every one of them
    # green — it died with THREE left. The suite needs roughly 16-17 minutes at
    # its current size, so the old cap missed by about a minute and threw away
    # the whole run, and all the real LLM spend with it.
    #
    # 25 leaves room for a slow provider day and for a few more cases without
    # this happening again. It is a ceiling, not a budget: the job still exits as
    # soon as the suite does, so a healthy run costs the same ~16 minutes it
    # always did. If CASES grows past ~25, revisit — or split the registers into
    # a matrix and run the three in parallel, which would cut wall-clock to a
    # third for the same number of calls.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Run the guardrail suite against the live /ask
        env:
          SB_URL: https://qyjmivntajbigjswhahb.supabase.co
          SERVICE_KEY: ${{ secrets.SERVICE_KEY }}
          ANON_KEY: ${{ secrets.ANON_KEY }}
        run: deno run --allow-net --allow-env --allow-read --allow-write scripts/guardrail-suite.ts

      # 🔴 THE ACCOUNT LEAK (task #59). 42 CI accounts had piled up in the auth
      # table, and every one came from a run that never finished — each has a
      # PARTIAL generated_answers count where a whole run makes 51. The newest
      # was created eleven seconds before `cancel-in-progress` killed its run.
      # Teardown was never broken; it lived inside the dying process.
      #
      # `always()` still schedules a step after a cancellation, which is the only
      # window there is. The suite writes its account id to guardrail-run.json
      # the moment the account exists and deletes the file once it has cleaned up
      # after itself, so on a healthy run this step finds nothing and says so.
      #
      # It cannot delete anything it lacks provenance for (the shared
      # acceptance-cleanup gate), and it never fails the job — a red cleanup step
      # on a green suite would be its own false alarm. Two minutes is plenty for
      # two HTTP calls, and caps the documented `always()` hang risk.
      - name: Remove the run's test account, even if the run was cancelled
        if: always()
        timeout-minutes: 2
        env:
          SB_URL: https://qyjmivntajbigjswhahb.supabase.co
          SERVICE_KEY: ${{ secrets.SERVICE_KEY }}
        run: deno run --allow-net --allow-env --allow-read --allow-write scripts/ci-cleanup.ts

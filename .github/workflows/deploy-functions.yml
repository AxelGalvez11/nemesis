# Edge-function deploy — from the reviewed source, never from a hand-copied paste.
#
# WHY THIS EXISTS. Until now every Supabase function in this repo was deployed by hand. That was
# survivable while functions changed rarely, and it broke down the moment one needed shipping as
# part of a feature: the only routes available were (a) a CLI that needs a credential nobody had
# loaded, or (b) pasting ~50KB of source into a deploy API call by hand.
#
# 🔴🔴🔴 (b) IS THE ONE THAT LOOKS FINE AND IS NOT. Everything else in this repo reaches production
# through git: reviewed in a PR, gated by `unit`, deployed from the commit that passed. A hand-copied
# payload has none of that. There is no diff between what was reviewed and what runs, no checksum,
# and no test between the paste and production — so a single mistyped character inside a regex
# deploys a function that is subtly wrong and looks correct. The deployed artifact must be provably
# the reviewed artifact, and the only way to get that is to deploy FROM the repository.
#
# 🔴 IT ONLY RUNS WHEN A FUNCTION ACTUALLY CHANGED, and only on main. `_shared/**` is in the paths
# filter because the functions import across it — a fix to `http.ts` changes what
# `nemesis-literature` does while leaving its own file untouched, and a deploy that missed that
# would leave production running code nobody has in front of them.
#
# 🔴 EACH FUNCTION IS NAMED. There is no "deploy everything that changed" glob, because
# `science-search` is deliberately NOT deployed: it imports the whole 42-connector registry and is
# gated off pending an owner decision. A glob would ship it the first time anyone touched a shared
# file. Adding a function here is how it becomes deployable — a visible, reviewable line.

name: deploy-functions

on:
  push:
    branches: [main]
    paths:
      - "supabase/functions/nemesis-literature/**"
      - "supabase/functions/_shared/science/**"
      # 🔴🔴 THE METERING VALVE, ADDED 2026-08-31 AFTER IT WENT ELEVEN DAYS UNDEPLOYED AND
      # UNNOTICED. `nemesis-llm` had been deployed by hand, so the repo and production drifted
      # and nobody could see it. It is the one function whose silence costs money rather than a
      # feature: it counts what we are billed AND enforces the plan caps.
      - "supabase/functions/nemesis-llm/**"
      # 🔴 THE INDEXER, ADDED 2026-09-03. It was NOT in this list, so a change to it shipped only if
      # somebody deployed it by hand — the exact drift that left `nemesis-llm` eleven days behind
      # the repo. Its silence costs a document being searchable, which is invisible from the
      # outside: the file is attached, parsed and complete, and answers no question.
      - "supabase/functions/source-index/**"
      - "supabase/functions/core-source-sync/**"
  # Deliberately available by hand too: a deploy that can only be triggered by a code change cannot
  # be re-run after a transient platform failure without an empty commit.
  workflow_dispatch: {}

concurrency:
  group: deploy-functions
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 🔴 v2.x, MATCHING EVERY OTHER WORKFLOW IN THIS REPO — unit.yml, guardrail.yml and eval.yml all
      # pin the same. This file originally pinned v1.x and the first real run died before it reached
      # the deploy: `deno.lock` is version 5, which Deno 1 refuses to read at all. The version here is
      # therefore not a free choice — it is set by the lockfile the repo already commits, and pinning
      # it low breaks every step downstream while pointing at the lockfile rather than at the pin.
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      # 🔴 TYPECHECK BEFORE UPLOAD, NOT AFTER. A Deno function fails at REQUEST time, not at deploy
      # time — a broken import or a type error deploys perfectly happily and then 500s for the first
      # learner who asks a question. `deno check` is the only gate that catches that before students do.
      - name: Typecheck the functions being deployed
        # 🔴 THE VALVE NEEDS TWO FLAGS THAT THE LITERATURE FUNCTION DOES NOT, AND BOTH ARE ABOUT
        # THIS REPO RATHER THAN ABOUT DENO. `nemesis-llm` imports supabase-js from JSR, which pulls
        # npm dependencies transitively; Deno then finds the pnpm workspace at the root, refuses to
        # resolve them out of it, and offers to rewrite package.json — in a repo where pnpm owns
        # that file. So: `DENO_NO_PACKAGE_JSON=1` tells Deno the workspace is none of its business,
        # and `--node-modules-dir=auto` lets it fetch its own copies into the runner's scratch. The
        # first run of this step failed exactly here, which is the gate doing its job.
        env:
          DENO_NO_PACKAGE_JSON: "1"
        run: |
          deno check supabase/functions/nemesis-literature/index.ts
          deno check --node-modules-dir=auto supabase/functions/nemesis-llm/index.ts
          deno check --node-modules-dir=auto supabase/functions/source-index/index.ts

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      # 🔴🔴🔴 AN EXPIRED TOKEN IS NOT A MISSING TOKEN, AND ONLY ONE OF THOSE FAILS LEGIBLY BY DEFAULT.
      # The owner created this credential 2026-08-24 with the 30-day expiry Supabase's form offered,
      # so it stops working around 2026-09-23 — this is a scheduled failure, not a hypothetical one.
      # A MISSING secret is empty and the check below names it in one line. An EXPIRED secret is
      # present, non-empty, correctly spelled, and refused by the API, so the run would die on a bare
      # CLI auth error weeks after anyone remembers a token was involved. Whoever reads that log will
      # not be whoever created the token, so the failure has to introduce itself.
      #
      # Replacing it with a longer-lived token needs no change here: generate, overwrite the secret,
      # re-run. Only the date in the message below goes stale, and a stale date still points at the
      # right page.
      - name: Deploy nemesis-literature
        # 🔴 TWO NAMES, ONE CREDENTIAL, AND ONLY ONE OF THEM IS OURS TO CHOOSE. The repository secret
        # is NEMESIS_DEPLOY — the owner's name for it, and the one to look for in Settings. The
        # environment variable must be SUPABASE_ACCESS_TOKEN because that is the name the Supabase
        # CLI reads; renaming it here would leave the CLI seeing no credential at all. So this line
        # is a deliberate bridge, not a copy-paste slip: do not "fix" either side to match the other.
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.NEMESIS_DEPLOY }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::The NEMESIS_DEPLOY secret is not set (or is empty). Generate a token at https://supabase.com/dashboard/account/tokens and add it under Settings → Secrets and variables → Actions, named exactly NEMESIS_DEPLOY."
            exit 1
          fi
          # Captured rather than streamed so the failure can be classified below. The deploy is a
          # single short upload; there is no long-running output being withheld from the log.
          set +e
          out=$(supabase functions deploy nemesis-literature \
            --project-ref qyjmivntajbigjswhahb \
            --no-verify-jwt 2>&1)
          status=$?
          set -e
          echo "$out"
          if [ $status -ne 0 ]; then
            # 🔴 MATCHES THE SHAPE OF A REFUSAL, NOT ONE EXACT SENTENCE. The CLI's wording for a
            # rejected token has changed between versions, and this hint is only ever read on a run
            # that is already failing — so a false positive costs a slightly wrong suggestion, while
            # a miss costs the entire reason this block exists.
            if echo "$out" | grep -qiE 'unauthorized|401|invalid access token|token .*(expired|invalid)|expired'; then
              echo "::error::Supabase refused the access token — it has most likely EXPIRED. The token in the NEMESIS_DEPLOY secret was created 2026-08-24 with a 30-day expiry (about 2026-09-23). Generate a new one at https://supabase.com/dashboard/account/tokens, overwrite the NEMESIS_DEPLOY secret with it, and re-run this workflow."
            fi
            exit $status
          fi

      # 🔴 SAME CREDENTIAL, SAME CLASSIFICATION, SEPARATE STEP — so a failure names WHICH function
      # did not ship. `--no-verify-jwt` is required: this one authenticates with its own device
      # keys (`nmk_...`), and platform JWT verification would reject every one of them.
      - name: Deploy nemesis-llm
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.NEMESIS_DEPLOY }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::The NEMESIS_DEPLOY secret is not set (or is empty). Generate a token at https://supabase.com/dashboard/account/tokens and add it under Settings → Secrets and variables → Actions, named exactly NEMESIS_DEPLOY."
            exit 1
          fi
          set +e
          out=$(supabase functions deploy nemesis-llm \
            --project-ref qyjmivntajbigjswhahb \
            --no-verify-jwt 2>&1)
          status=$?
          set -e
          echo "$out"
          if [ $status -ne 0 ]; then
            if echo "$out" | grep -qiE 'unauthorized|401|invalid access token|token .*(expired|invalid)|expired'; then
              echo "::error::Supabase refused the access token — it has most likely EXPIRED. Generate a new one at https://supabase.com/dashboard/account/tokens, overwrite the NEMESIS_DEPLOY secret with it, and re-run this workflow."
            fi
            exit $status
          fi

      # 🔴 SAME CREDENTIAL, SEPARATE STEP, so a failure names WHICH function did not ship.
      # `--no-verify-jwt` because this function does its own, STRICTER check: `unauthorized()`
      # requires an exact `Bearer <service role>` rather than merely a well-formed JWT. Deploying it
      # with platform verification would add a second gate in front of the one that actually
      # governs, and the only thing that could change is pg_net's call being refused before the
      # function ever sees it — which is silent, because a document that is never indexed looks
      # exactly like a document with nothing to say.
      - name: Deploy source-index
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.NEMESIS_DEPLOY }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::The NEMESIS_DEPLOY secret is not set (or is empty). Generate a token at https://supabase.com/dashboard/account/tokens and add it under Settings → Secrets and variables → Actions, named exactly NEMESIS_DEPLOY."
            exit 1
          fi
          set +e
          out=$(supabase functions deploy source-index \
            --project-ref qyjmivntajbigjswhahb \
            --no-verify-jwt 2>&1)
          status=$?
          set -e
          echo "$out"
          if [ $status -ne 0 ]; then
            if echo "$out" | grep -qiE 'unauthorized|401|invalid access token|token .*(expired|invalid)|expired'; then
              echo "::error::Supabase refused the access token — it has most likely EXPIRED. Generate a new one at https://supabase.com/dashboard/account/tokens, overwrite the NEMESIS_DEPLOY secret with it, and re-run this workflow."
            fi
            exit $status
          fi

      # 🔴 401 IS THE PASS HERE TOO. It proves the indexer booted and still refuses a caller who is
      # not holding the service role. A 200 would mean anyone can start an embedding run.
      - name: Confirm the indexer answers, and still refuses a caller with no key
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
            "https://qyjmivntajbigjswhahb.supabase.co/functions/v1/source-index" \
            -H "Content-Type: application/json" -d '{}')
          echo "source-index answered $code"
          if [ "$code" != "401" ]; then
            echo "::error::source-index answered $code to a request with no credential; 401 is the only correct answer."
            exit 1
          fi

      # 🔴 401 IS THE PASS. An unauthenticated completion must be REFUSED — that proves the
      # function booted, parsed the request and reached its own device-key check. A 5xx would mean
      # it deployed broken, and a 200 would mean it answers without a key, which is worse.
      - name: Confirm the valve answers, and still refuses a caller with no key
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
            "https://qyjmivntajbigjswhahb.supabase.co/functions/v1/nemesis-llm/v1/chat/completions" \
            -H "Content-Type: application/json" \
            -d '{"messages":[{"role":"user","content":"smoke"}]}')
          echo "nemesis-llm answered $code"
          if [ "$code" != "401" ] && [ "$code" != "403" ]; then
            echo "::error::Expected 401/403 from an unauthenticated completion; got $code."
            exit 1
          fi

      # The function verifies the caller itself (a Supabase user token, anonymous sessions
      # rejected), which is why --no-verify-jwt is correct here rather than lax: platform JWT
      # verification would reject the device-key style callers other functions use, and this one's
      # own `verifyUser` is the check that matters. See its header.
      - name: Confirm it answers
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
            "https://qyjmivntajbigjswhahb.supabase.co/functions/v1/nemesis-literature" \
            -H "Content-Type: application/json" \
            -d '{"action":"literature","query":"smoke"}')
          # 401 is the RIGHT answer to an unauthenticated smoke test: it proves the function is
          # deployed, routing, and refusing anonymous callers. A 404 means the deploy did not land.
          echo "unauthenticated probe returned $code"
          if [ "$code" != "401" ]; then
            echo "::error::expected 401 from an unauthenticated call; got $code"
            exit 1
          fi

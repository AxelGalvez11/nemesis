# Unit gate — the cheap, always-on deterministic check across EVERY surface.
#
# Runs on every push + PR. Unlike guardrail.yml (integration: real LLM calls,
# secrets, scoped to PRs into main), these are PURE units — no network, no
# secrets — so they run broadly and fast.
#
# They lock the deterministic safety layer: safety.test.ts (preScreen +
# detectViolations forbidden-pattern detector), citation.test.ts, and
# routing.test.ts — which asserts the post-enforcement PROFESSIONAL_ROUTING_NOTE
# trips ZERO detectViolations. That note is appended after the runtime safety
# scan, so this test IS its guarantee: keep it in CI.
#
# TWO JOBS, because the repo has two test runtimes and neither can host the
# other:
#   deno-units — edge functions, the mobile app, and packages/shared.
#   web-units  — apps/web, which runs on Node.
# Deno CANNOT run the web suite: apps/web imports through the "@/..." alias that
# Next.js resolves from tsconfig paths, and Deno stops on the first such import
# ('Import "@/lib/utils" not a dependency'). Trying to fold apps/web into the
# Deno steps therefore fails before a single web assertion executes. Keep them
# apart.

name: unit

on:
  push: {}
  pull_request: {}

concurrency:
  group: unit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Job name kept as ask-units so any existing branch-protection rule or saved
  # check reference keeps pointing at the same thing.
  ask-units:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # 🔴 THE INSTALL IS LOAD-BEARING, NOT BOILERPLATE.
      # Without it this job died on the THIRD step for at least two days:
      #   error: Could not resolve "@nemesis/shared", but found it in a
      #   package.json. Deno expects the node_modules/ directory to be up to date.
      # Deno resolves a workspace package by walking the FILESYSTEM for
      # apps/mobile/node_modules/@nemesis/shared. pnpm creates that symlink at
      # install time (both apps declare "@nemesis/shared": "workspace:*"), and a
      # bare checkout has no node_modules at all. The workflow used to run
      # `deno test` straight after checkout, which worked only while the mobile
      # tests had no cross-package imports; apps/mobile/src/lib/academic-skills.ts
      # now imports @nemesis/shared, and the whole job has failed ever since.
      #
      # Because GitHub runs each `run:` under `bash -e`, that third-step failure
      # also meant step FOUR never executed — so packages/shared's 51 test files
      # were not merely failing, they were never started.
      #
      # pnpm/action-setup reads the version from the root package.json
      # "packageManager" field; passing `version:` as well is an error.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install workspace dependencies (so Deno can resolve @nemesis/shared)
        run: pnpm install --frozen-lockfile

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Deno unit tests (ask edge function)
        run: deno test --allow-env supabase/functions/ask/
      - name: Deno unit tests (shared cost attribution)
        run: deno test --allow-env supabase/functions/_shared/
      # --allow-read is for no-external-purchase.test.ts, which reads the app's
      # own source to prove no App Store 3.1.1(a) purchase link has crept back in.
      #
      # --ignore=apps/mobile/src/app is NOT a skipped test directory: `deno test`
      # treats any file literally named `test.tsx` as a test file, and the Tests
      # SCREEN is `src/app/test.tsx` (an expo-router route, so it cannot be
      # renamed without changing the in-app URL). Deno tried to load a React
      # screen, failed on the `@/` path alias, and aborted the WHOLE run before a
      # single test executed. No real test lives under src/app — all of them are
      # elsewhere — so ignoring that folder costs nothing and restores the suite.
      - name: Deno unit tests (mobile app — incl. the analytics privacy core)
        run: deno test --no-check --allow-env --allow-read --ignore=apps/mobile/src/app apps/mobile/src/
      # packages/shared had 46 test files and NO runner: the Deno steps above
      # name specific directories and the web's `tsx --test` globs only reach
      # under apps/web. So 312 passing assertions — the writing voice, the
      # untrusted-content fence, the brain packet — were being written and never
      # run, which is worse than having none, because the green tick implied they
      # were. Found while moving the artifact-context tests here from
      # apps/mobile/src/lib, where they HAD been running.
      # Deno runs both flavours in this folder (it supports node:test), so one
      # line covers all of them.
      - name: Deno unit tests (shared package — web + iOS both depend on it)
        run: deno test --no-check --allow-env --allow-read packages/shared/src/

  # apps/web's 92 test files (688 assertions) were wired into NOTHING before this
  # job existed — not GitHub Actions, and not Vercel either, whose build is a
  # plain `next build` with no test step (apps/web/vercel.json sets only
  # framework + crons). The suite passes and always has; the only thing missing
  # was anything that ran it when nobody typed the command by hand.
  #
  # Deliberately a SEPARATE job rather than another step on ask-units: it needs
  # no Deno, it is the only Node-runtime suite, and keeping it independent means
  # a red web suite still lets you read the Deno results and vice versa.
  web-units:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # --filter, not `pnpm test` at the root: the root script goes through
      # turbo, whose test task declares dependsOn ["^build"], which would build
      # the whole Next.js app just to run unit tests that never touch the build
      # output. Calling the package script directly skips that entirely.
      - name: Node unit tests (web app)
        run: pnpm --filter @nemesis/web test

      # 🔴 TYPES WERE NOT A PR GATE UNTIL 2026-08-05, AND IT COST US.
      # PR #426 landed a real `error TS2322` on main. Nothing here caught it —
      # this job runs tests, not `tsc` — and the only gate that would have,
      # Vercel's build, had hit its daily rate limit and reported a red that
      # said "retry in 24 hours" rather than "your types are broken".
      #
      # So a type error reached main on a fully green PR. Deploy health is not a
      # substitute for a type gate: it shares a quota, it is external, and it is
      # not run per-package. This is cheap (tsc --noEmit, no build output) and it
      # covers the shared package and the phone app as well as web.
      - name: Types (every package)
        run: pnpm turbo run typecheck

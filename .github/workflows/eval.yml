# .github/workflows/eval.yml
# Quality gate (complements guardrail.yml, the safety gate). Retrieval-eval is cheap +
# deterministic (no LLM, no /ask quota), so it runs on PRs into main and fails if
# aggregate retrieval metrics regress below the committed baseline minus a tolerance band.
name: eval
on:
  pull_request:
    branches: [main]
  workflow_dispatch: {}
concurrency:
  group: eval-${{ github.ref }}
  cancel-in-progress: true
jobs:
  retrieval-eval:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Skip fork PRs (no secrets → would exit for a config reason, not a regression).
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Cache eval deps
        run: deno cache eval/ci-gate.ts eval/retrieval-eval.ts eval/lib/metrics.test.ts
      - name: Metric math unit tests
        run: deno test eval/lib/metrics.test.ts
      - name: Retrieval eval vs committed baseline
        env:
          SB_URL: ${{ secrets.SB_URL }}
          SERVICE_KEY: ${{ secrets.SERVICE_KEY }}
          ANON_KEY: ${{ secrets.ANON_KEY }}
          VOYAGE_API_KEY: ${{ secrets.VOYAGE_API_KEY }}
        run: deno run --allow-net --allow-env --allow-read --allow-write eval/ci-gate.ts

      # 🔴 THE SECOND ACCOUNT LEAK. This job runs on EVERY pull request and mints
      # an `eval+…@nemesis.test` account, and `cancel-in-progress` above means a
      # second push cancels the first run mid-flight — killing the process before
      # its teardown, exactly as it did for the guardrail suite (42 accounts).
      #
      # `always()` is the one condition GitHub still schedules after a
      # cancellation. The harness writes its account id to a file the instant the
      # account exists and deletes that file once it has cleaned up after itself,
      # so on a healthy run this finds nothing. The delete goes through the shared
      # provenance gate and this step never fails the job.
      - name: Remove the run's test account, even if the run was cancelled
        if: always()
        timeout-minutes: 2
        env:
          SB_URL: ${{ secrets.SB_URL }}
          SERVICE_KEY: ${{ secrets.SERVICE_KEY }}
        run: deno run --allow-net --allow-env --allow-read --allow-write scripts/ci-cleanup.ts

<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Nemesis</title>
    <style>
      /* Self-contained: an extension page cannot load anything remote, and
         should not want to.

         THIS PANEL IS ONLY THE BUTTON (owner 2026-07-31). It used to list the
         courses too, which put the same information in two places — and put
         the more useful copy in the one that vanishes the moment you click the
         page. Everything about a reading (counts, progress, the course names,
         the way back) now lives on the card at the bottom right of the portal
         itself, where it survives. This panel exists because
         chrome.permissions.request only works inside a real user gesture, and
         pressing the button below IS that gesture.

         Black and white, matching the card. No accent colour. */
      :root {
        color-scheme: light dark;
        --bg: #ffffff;
        --fg: #14161a;
        --muted: #6b7280;
        --line: #e5e7eb;
        --solid: #17191d;
        --on-solid: #ffffff;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #17191d;
          --fg: #f2f4f7;
          --muted: #9aa2ae;
          --line: #2a2e35;
          --solid: #f2f4f7;
          --on-solid: #14161a;
        }
      }
      * { box-sizing: border-box; }
      body {
        background: var(--bg);
        color: var(--fg);
        font: 13px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
        margin: 0;
        padding: 14px;
        width: 300px;
      }
      h1 { font-size: 13px; font-weight: 600; letter-spacing: -0.01em; margin: 0 0 3px; }
      p.lede { color: var(--muted); font-size: 12px; margin: 0 0 12px; }
      #status { font-size: 12.5px; margin: 0 0 12px; }
      #status[data-tone="bad"] { color: var(--muted); }
      button {
        background: var(--solid);
        border: 0;
        border-radius: 9px;
        color: var(--on-solid);
        cursor: pointer;
        font: inherit;
        font-size: 12.5px;
        font-weight: 560;
        padding: 8px 12px;
        width: 100%;
      }
      button[disabled] { cursor: default; opacity: 0.5; }
      button.secondary {
        background: transparent;
        border: 1px solid var(--line);
        color: var(--fg);
        font-weight: 500;
      }
      .row { display: flex; flex-direction: column; gap: 6px; }
      footer {
        border-top: 1px solid var(--line);
        color: var(--muted);
        font-size: 11.5px;
        margin-top: 12px;
        padding-top: 10px;
      }
    </style>
  </head>
  <body>
    <h1>Nemesis</h1>
    <p class="lede">Reads the courses already on your school portal. It never changes anything there.</p>

    <p id="status">Open your school portal, then read this page.</p>

    <div class="row">
      <button id="scan" type="button">Read this page</button>
      <button class="secondary" hidden id="next" type="button">Open Nemesis to finish</button>
      <button class="secondary" hidden id="clear" type="button">Clear what is stored</button>
    </div>

    <footer>What it finds stays in this browser until you import it.</footer>

    <script src="popup.js" type="module"></script>
  </body>
</html>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="9.6 13.6 80.8 80.8">
  <!--
    The favicon: the three-dot mark, two dots up and one dot down.

    Geometry is IDENTICAL to components/NemesisMark.tsx (MARK_DOTS), duplicated on purpose: that one is React and this
    has to be a standalone file Next serves as an icon. lib/mark.test.ts fails if the copies drift.

    A favicon is drawn against the BROWSER's chrome rather than the page, so it cannot inherit a colour
    and carries its own: black, inverted to white where the browser reports dark mode.
  -->
  <style>
    .mark { fill: #000; }
    @media (prefers-color-scheme: dark) {
      .mark { fill: #fff; }
    }
  </style>
  <g class="mark">
    <circle cx="24.02" cy="35" r="10.8" />
    <circle cx="75.98" cy="35" r="10.8" />
    <circle cx="50" cy="80" r="10.8" />
  </g>
</svg>
